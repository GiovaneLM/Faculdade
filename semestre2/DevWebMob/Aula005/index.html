<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations CSS</title>
    <style type="text/css">

        .move{
            width: 100px;
            height: 100px;
            background: blue;
            border-radius: 5px;
            animation-name: cores;
            animation-duration: 5s;
            animation-timing-function: ease;
            animation-timing-function: linear;
            animation-fill-mode: backwards;
            /* forwards - backwards - both */
            animation-iteration-count: 4;/* infinite - numero */
            animation-direction: alternate;
            /* alternate - reverse - alternate-reverse */

            animation-play-state: paused;
        }

        .move:hover{
            animation-play-state: running;
            /* running - paused */
        }

        .foguete img{
            animation: nave 5s ease infinite;
        }


        /*Desenvolver os estilos da animação*/
        @keyframes cores{
            from{background: blue; margin-left: 0; transform: rotate(0);}
            to{background: red; margin-left: 85%; transform: rotate(720deg);}
        }

        @keyframes nave{
            0%{margin-left: 0; transform: rotate(0deg);}
            10%{margin-left: 0; transform: rotate(45deg);}
            50%{margin-left: calc(100% - 75px); transform: rotate(45deg);}
            60%{margin-left: calc(100% - 75px); transform: rotate(-130deg);}
            95%{margin-left: 0; transform: rotate(-135deg);}
            100%{margin-left: 0; transform: rotate(0deg);}
        }

        body{
            margin: 0;
        }

        .topo{
            background: linear-gradient(blue , darkblue);
            padding: 10px 5px;
            margin-bottom: 100px;
        }
        
        .logo img{
            transform: translate(-140px);
            animation: logo 3s ease-in;
            animation-fill-mode: forwards;
        }


        /*@keyframes logo {
            0%{transform: translateX(-140px);}
            70%{transform: translateX(40px) rotate(0deg);}
            75%{transform: translateX(40px) rotate(15deg);}
            80%{transform: translateX(40px) rotate(0deg);}
            100%{transform: translateX(0px) rotate(0deg);}
        }*/

        @keyframes logo {
            0%{transform: translateX(-500px, -15px);}
            0%{transform: translateX(-140px);}
            30%{transform: translate(100px, 30px);}
            50%{transform: translate(200px, -25px);}
            60%{transform: translate(300px, 0px);}
            75%{transform: translateX(400px, -30px);}
            90%{transform: translateX(450px, 10px);}
            100%{transform: translateX(500px, -15px);}
        }

        .load{
            margin: 80px;
            text-align: center;
        }

        .load .circle{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: yellow;
            display: inline-block;
            margin: 0 6px;
            animation: load 2s linear infinite alternate;
        }

        .load .circle:nth-child(2){animation-delay: 1s;}
        .load .circle:nth-child(3){animation-delay: 2s;}
        .load .circle:nth-child(4){animation-delay: 3s;}
        .load .circle:nth-child(5){animation-delay: 4s;}

        @keyframes load {
            0%{background: yellow; transform: scale(1);}
            33%{background: green; transform: scale(1.1);}
            66%{background: red; transform: scale(1.2);}
            100%{background: blue; transform: scale(1.3);}
        }
    </style>
</head>
<body>
    <header class="topo">
        <div class="logo">
            <img src="img/peixe.png" alt="">
        </div>
    </header>
    <div class="move"></div>

    <div class="foguete">
        <img src="img/foguete.png" alt="">
    </div>

    <div class="load">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
</body>
</html>
