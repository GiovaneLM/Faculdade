<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations CSS</title>
    <style type="text/css">

        .move{
            width: 100px;
            height: 100px;
            background: blue;
            border-radius: 5px;
            animation-name: cores;
            animation-duration: 5s;
            animation-timing-function: ease;
            animation-timing-function: linear;
            animation-fill-mode: backwards;
            /* forwards - backwards - both */
            animation-iteration-count: 4;/* infinite - numero */
            animation-direction: alternate;
            /* alternate - reverse - alternate-reverse */

            animation-play-state: paused;
        }

        .move:hover{
            animation-play-state: running;
            /* running - paused */
        }

        .foguete img{
            animation: nave 5s ease infinite;
        }


        /*Desenvolver os estilos da animação*/
        @keyframes cores{
            from{background: blue; margin-left: 0; transform: rotate(0);}
            to{background: red; margin-left: 85%; transform: rotate(720deg);}
        }

        @keyframes nave{
            0%{margin-left: 0; transform: rotate(0deg);}
            10%{margin-left: 0; transform: rotate(45deg);}
            50%{margin-left: calc(100% - 75px); transform: rotate(45deg);}
            60%{margin-left: calc(100% - 75px); transform: rotate(-130deg);}
            95%{margin-left: 0; transform: rotate(-135deg);}
            100%{margin-left: 0; transform: rotate(0deg);}
        }

        body{
            margin: 0;
        }

        .topo{
            background: blue;
            padding: 10px 5px;
            margin-bottom: 100px;
        }
        
    </style>
</head>
<body>
    <header class="topo">
        <div class="logo">
            <img src="img/peixe.png" alt="">
        </div>
    </header>
    <div class="move"></div>

    <div class="foguete">
        <img src="img/foguete.png" alt="">
    </div>
</body>
</html>
