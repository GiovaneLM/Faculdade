<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Transitions CSS</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
	<!-- Transições com CSS -->
	<!-- https://www.w3schools.com/css/css3_transitions.asp -->
	<header id="topo">
		<div class="logo">
			<div class="simbolo"></div>
		</div>
		<nav>
			<ul class="menu">
				<li> <a href="#">Home</a> </li>
				<li> <a href="#">Empresa</a> </li>
				<li class="submenu"> 
					<a href="#">Serviços</a> 
					<ul class="sub">
						<li><a href="#">Banho e Tosa</a></li>
						<li><a href="#">Vacinação</a></li>
						<li><a href="#">Venda de Ração</a></li>
						<li><a href="#">Castração</a></li>
					</ul>
				</li>
				<li> <a href="#">Contato</a> </li>
			</ul>
		</nav>
	</header>
	<section class="conteudo">
		<h2>Entendendo as time-functions </h2>
		<input type="checkbox" id="acionar">

		<div class="carros">
			<div class="car">
				Linear
				<img src="img/car.png" alt="Carro">
			</div>
			<div class="car">
				Ease
				<img src="img/car.png" alt="Carro">
			</div>
			<div class="car">
				Ease-in
				<img src="img/car.png" alt="Carro">
			</div>
			<div class="car">
				Ease-out
				<img src="img/car.png" alt="Carro">
			</div>
			<div class="car">
				Personalizado
				<img src="img/car.png" alt="Carro">
			</div>
		</div>


		<div class="galeria">
			<div class="foto">
				<img src="img/inseto.jpg" alt="Inseto">
			</div>
		</div>


	</section>
</body>
</html>
