<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .coluna{
            background: black;
            color: white;
            padding: 25px;
            border: solid 1px black;
            border-radius: 10px;
            font-size: 48px;
        }
        .grid{
            /*gridbox*/
            display: grid;
            /*grid-template-columns: 100px 100px 100px 100px 100px;*/
            /*grid-template-columns: 30% 20% 20% 30%;*/
            /*grid-template-columns: 200px 250px 300px 350px;
            grid-template-columns: 120px 120px 120px 120px 120px 120px 120px 120px;
            grid-template-columns: repeat(8,100px);
            grid-template-columns: repeat(4,25%);
            grid-template-columns: 10% repeat(4,20%) 10% ;*/
            grid-template-columns: 30% repeat(2,20%) 30% ;
            grid-template-rows: 180px 230px ;
            gap: 5px 15px;
            justify-content: center;
            height: 100vh;
            
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="coluna">1</div>
        <div class="coluna">2</div>
        <div class="coluna">3</div>
        <div class="coluna">4</div>
        <div class="coluna">5</div>
        <div class="coluna">6</div>
        <div class="coluna">7</div>
        <div class="coluna">8</div>
    </div>
</body>
</html>
